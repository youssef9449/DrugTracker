name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Run deterministic architecture gates
        run: node scripts/verify-architecture.mjs
      - name: Verify Group 10 cleanup invariants
        run: node scripts/test-group10-final-cleanup.mjs

  javascript:
    name: JavaScript dependency lock and verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install exactly the committed dependency graph
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
      - name: Build and verify PWA asset graph
        if: ${{ !cancelled() }}
        run: npm run build && node scripts/test-pwa-build.mjs

  android-integration:
    name: Clean generated Android integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      # Environment setup only; validation is performed by Gradle and the
      # dependency-free repository scripts below.
      - name: Install committed dependency graph
        run: npm ci

      - name: Build web assets for clean Capacitor generation
        run: npm run build

      - name: Generate a clean Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare repository-owned Android integration
        run: node scripts/prepare-android.mjs

      - name: Verify Android preparation invariants
        run: node scripts/test-prepare-android-receivers.mjs

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile the prepared Android application
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

  native:
    name: Native JVM tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run JVM tests and SpotBugs
        working-directory: native-android/jvm-tests
        run: bash ./gradlew test spotbugsMain --no-daemon
