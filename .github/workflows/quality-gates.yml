name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Run deterministic architecture gates
        run: node scripts/verify-architecture.mjs

  javascript:
    name: JavaScript dependency lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm

      - name: Install exactly the committed dependency graph
        run: npm ci

  native:
    name: Native JVM tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run JVM tests and SpotBugs
        working-directory: native-android/jvm-tests
        run: bash ./gradlew spotbugsStaticAnalysis --no-daemon
