<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      Accessibility (M9): allow user pinch-zoom. The previous
      `maximum-scale=1.0, user-scalable=no` blocked zoom, which is an
      accessibility regression for a medication-reminder app whose
      audience includes older users. `viewport-fit=cover` is kept so
      the app can use the full notched display.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Respect the OS light/dark preference for the browser chrome -->
    <meta name="color-scheme" content="light dark" />
    <title>النغنغ</title>
    <meta name="description" content="النغنغ - تطبيق لمتابعة مخزون الأدوية وتنبيهك عند اقتراب نفاد الحبوب بناءً على معدل الاستهلاك اليومي." />
    <meta property="og:title" content="النغنغ" />
    <meta property="og:description" content="النغنغ - تطبيق لمتابعة مخزون الأدوية وتنبيهك عند اقتراب نفاد الحبوب بناءً على معدل الاستهلاك اليومي." />
    <meta property="og:type" content="website" />

    <!-- Theme color for browser chrome (matches teal-800 used by the AppHeader) -->
    <meta name="theme-color" content="#0f766e" />

    <!-- PWA / mobile web app meta tags (Android Chrome + iOS Safari) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="النغنغ" />
    <meta name="application-name" content="النغنغ" />

    <!-- Web App Manifest (used by Android Chrome for "Install app" → APK-like icon) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- App icons (served from /assets/icons/) -->
    <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
    <!-- #119: iOS Safari prefers 180x180 for the home-screen icon. -->
    <link rel="apple-touch-icon" href="/assets/icons/icon-180.png" />

    <!--
      Fonts (L9): the previous <link> tags loaded Cairo + Plus Jakarta Sans
      from the Google Fonts CDN. That has two problems for an offline
      PWA: (1) the fonts fail when offline (the service worker skips
      cross-origin requests), and (2) it leaks the user's IP / reading
      habits to a third party on every load. Plus Jakarta Sans wasn't
      even referenced in CSS.

      We now rely on a system Arabic-capable font stack (set on the
      <body> below and in src/index.css). If you want to ship the
      Cairo typeface specifically, self-host the woff2 files under
      /assets/fonts and add a @font-face rule — but a system stack is
      a reasonable, zero-network default for an installable PWA.
    -->
  </head>
  <body class="bg-slate-100 font-arabic-sans antialiased text-slate-800 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
