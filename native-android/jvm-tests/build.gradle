plugins {
    id 'java'
    id 'com.github.spotbugs' version '6.5.11'
}

def spotbugsClassLoader = plugins['com.github.spotbugs'].class.classLoader
def SpotBugsEffort = spotbugsClassLoader.loadClass('com.github.spotbugs.snom.Effort')
def SpotBugsConfidence = spotbugsClassLoader.loadClass('com.github.spotbugs.snom.Confidence')

spotbugs {
    // The JVM module compiles the repository-owned production native runtime.
    // Restrict analysis to that production package; test/Capacitor compile stubs
    // are deliberately outside the static-analysis target.
    onlyAnalyze = ['app.drugtracker.*']

    // Start with high-confidence findings so the gate is actionable rather
    // than becoming a wall of low-confidence noise. Any intentional exception
    // must be represented by an explicit SpotBugs filter/baseline in a later
    // change; failures are never silently ignored.
    effort = SpotBugsEffort.valueOf('MAX')
    reportLevel = SpotBugsConfidence.valueOf('HIGH')
    ignoreFailures = false
    runOnCheck = true
    showProgress = true
    showStackTraces = true
}

spotbugsMain {
    reports {
        xml.required = true
        html.required = true
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    google()
    mavenCentral()
}

/**
 * Compile against the repository-owned native runtime/feature sources (excluding
 * Capacitor bridge plugins). Sources are synced into their real package paths so
 * tests exercise the production Java implementation, not a copy.
 */
def productionSources = fileTree("../auto-deduction") {
    include(
            "AutoDeductionContract.java",
            "AutoDeductionEventStore.java",
            "AutoDeductionScheduler.java",
            "AutoDeductionSchedulingAdapter.java",
            "AutoDeductionReceiver.java",
            "AutoDeductionStockStore.java",
            "AutoDeductionLifecycle.java",
            "AutoDeductionAlarmFeature.java"
    )
}

def alarmRuntimeSources = fileTree("../alarm-runtime") {
    include(
            "ExactAlarmContract.java",
            "ExactAlarmOperationLock.java",
            "ExactAlarmStore.java",
            "ExactAlarmRuntime.java",
            "ExactAlarmLifecycle.java",
            "DrugTrackerAlarmSystemReceiver.java",
            "ExactAlarmFeatureAdapter.java",
            "DoseReminderAlarmFeature.java"
    )
}

def notificationRuntimeSources = fileTree("../notification-runtime") {
    include(
            "AppForegroundState.java",
            "NotificationRuntime.java",
            "NotificationRuntimeActionReceiver.java"
    )
}

def doseReminderAlarmSources = fileTree("../dose-reminder") {
    include(
            "DoseReminderAlarmAdapter.java",
            "DoseReminderAlarmReceiver.java"
    )
}

def criticalStockAlarmSources = fileTree("../critical-stock") {
    include(
            "CriticalStockAlarmAdapter.java",
            "CriticalStockAlarmReceiver.java"
    )
}

def syncedMain = layout.buildDirectory.dir("synced-main/app/drugtracker/autodeduction")
def syncedAlarmRuntime = layout.buildDirectory.dir("synced-main/app/drugtracker/alarmruntime")
def syncedNotificationRuntime = layout.buildDirectory.dir(
        "synced-main/app/drugtracker/notificationruntime")
def syncedDoseReminder = layout.buildDirectory.dir(
        "synced-main/app/drugtracker/dosereminder")
def syncedCriticalStock = layout.buildDirectory.dir(
        "synced-main/app/drugtracker/criticalstock")

tasks.register("syncProductionSources", Copy) {
    from productionSources
    into syncedMain
}

tasks.register("syncAlarmRuntime", Copy) {
    from alarmRuntimeSources
    into syncedAlarmRuntime
}

tasks.register("syncNotificationRuntime", Copy) {
    from notificationRuntimeSources
    into syncedNotificationRuntime
}

tasks.register("syncDoseReminderAlarmSources", Copy) {
    from doseReminderAlarmSources
    into syncedDoseReminder
}

tasks.register("syncCriticalStockAlarmSources", Copy) {
    from criticalStockAlarmSources
    into syncedCriticalStock
}

sourceSets {
    main {
        java {
            // Production sources (synced) + compile stubs for Capacitor/AndroidX peers
            srcDirs = [
                    layout.buildDirectory.dir("synced-main"),
                    "src/main/java"
            ]
        }
    }
}

tasks.named("compileJava").configure {
    dependsOn(
            "syncProductionSources",
            "syncAlarmRuntime",
            "syncNotificationRuntime",
            "syncDoseReminderAlarmSources",
            "syncCriticalStockAlarmSources"
    )
}
tasks.named("processResources").configure {
    dependsOn(
            "syncProductionSources",
            "syncAlarmRuntime",
            "syncNotificationRuntime",
            "syncDoseReminderAlarmSources",
            "syncCriticalStockAlarmSources"
    )
}

configurations {
    /**
     * Resolves androidx.test:monitor as an AAR so we can extract its
     * classes.jar and make InstrumentationRegistry available on the
     * JVM test runtime classpath (the plain java plugin cannot extract
     * classes.jar from AAR dependencies natively).
     */
    monitorAar
}

/**
 * Extract classes.jar from the monitor AAR into a build-generated directory.
 * Deterministic + reproducible — no hardcoded cache paths.
 * Declared BEFORE the dependencies block: the dependencies section attaches
 * this directory to the testCompileOnly classpath.
 */
def extractedAarClasses = layout.buildDirectory.dir("extracted-aar-classes")

dependencies {
    def androidAll = "org.robolectric:android-all:13-robolectric-9030017"
    compileOnly androidAll
    testImplementation androidAll

    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "junit:junit:4.13.2"

    // androidx.test:monitor:1.7.0 provides androidx.test.platform.app.InstrumentationRegistry
    // (required by Robolectric 4.11.1's AndroidTestEnvironment at runtime; absent in 1.6.1).
    // monitor is an AAR; transitive=false avoids pulling AAR-only deps (tracing, annotation-experimental)
    // that fail variant resolution against a plain java project. InstrumentationRegistry only
    // references android.app.Instrumentation + android.os.Bundle (in android-all) + JDK types.
    monitorAar("androidx.test:monitor:1.7.0") {
        transitive = false
    }
    // Compile-time visibility for the extracted monitor classes (test sources
    // import InstrumentationRegistry directly). fileTree so the classes.jar
    // INSIDE the directory is picked up (a plain directory entry would not
    // recurse into jars).
    testCompileOnly fileTree(extractedAarClasses)
}

tasks.register("extractMonitorClasses") {
    outputs.dir(extractedAarClasses)
    doLast {
        def outDir = extractedAarClasses.get().asFile
        outDir.mkdirs()
        // Remove stale extractions so re-runs can overwrite read-only jars.
        outDir.listFiles()?.each { it.delete() }
        configurations.monitorAar.files.each { aar ->
            copy {
                from(zipTree(aar)) {
                    include("classes.jar")
                }
                into(extractedAarClasses)
                rename("classes.jar", "monitor-1.7.0-classes.jar")
            }
        }
    }
}

tasks.named("test").configure {
    dependsOn("extractMonitorClasses")
    // Add extracted AAR classes.jar to the test runtime classpath.
    classpath += fileTree(extractedAarClasses)
}

/**
 * InstrumentationRegistry (androidx.test.platform.app) must also be on the
 * COMPILE classpath for test sources — monitor is an AAR, so its extracted
 * classes.jar (from extractMonitorClasses) is added as testCompileOnly.
 * The plain java plugin cannot consume the AAR directly.
 */
tasks.matching { it.name == "compileTestJava" }.configureEach {
    dependsOn("extractMonitorClasses")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

test {
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}